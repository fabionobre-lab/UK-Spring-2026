name: Deploy Zarparia
on:
  push:
    branches: ["**"]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck (svelte-check)
        run: npm run check
      - name: Unit tests
        run: npm test

  # The app is a Cloudflare Worker (not Pages), so there are no branch preview
  # deploys: every branch gets verified, only main deploys.
  deploy:
    if: github.ref_name == 'main'
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build and deploy Worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fa4533d7349b982451702efa056eee47
      - name: Smoke check production
        run: |
          sleep 15
          curl -fsS https://trips.fabionobre-ai.workers.dev/api/health | grep -q '"ok":true'
